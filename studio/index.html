<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cube Studio</title>
<link rel="icon" href="/studio/icon.svg">
<link rel="stylesheet" href="/kit/ui.css">
<style>
/* Cube Studio on the kit (kit/ui.css): the Director · the viewer · the render queue */
.shell { --side-w: 330px; }

/* the stage: title bar, viewer, transport, notes */
.stage { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; }
.bar { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; padding: 12px 18px; border-bottom: .5px solid var(--separator); }
.bar .titles { min-width: 0; flex: 1 1 260px; }
.bar h1 { margin: 0; font: 600 17px/1.25 var(--font-display); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .sub { display: flex; align-items: center; gap: 8px; margin-top: 3px; min-width: 0; }
.bar .branch { color: var(--label-3); white-space: nowrap; }
.bar .notes { color: var(--label-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.bar .notes.s-attention { color: var(--red); }
.bar-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.toggle { height: 28px; padding: 0 10px; border-radius: 8px; color: var(--label-2); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.toggle:hover { background: var(--fill-2); color: var(--label); }
.toggle.on { color: var(--accent); background: var(--accent-soft); }
.toggle:disabled { opacity: .35; cursor: default; background: none; }
.toggle svg { width: 15px; height: 15px; }
.src { display: inline-flex; align-items: center; gap: 2px; }
.src .select { max-width: 230px; }

.viewer { position: relative; overflow: hidden; background: #0b0b0c; min-height: 0; }
.viewer .fit { position: absolute; transform-origin: 0 0; box-shadow: 0 20px 60px -20px rgba(0,0,0,.7); border-radius: 2px; overflow: hidden; }
.viewer iframe { border: 0; display: block; background: #000; }
.viewer .loading { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.5); }
.viewer .err { position: absolute; left: 16px; right: 16px; bottom: 16px; max-height: 45%; overflow: auto; display: none; background: rgba(40,12,10,.92); border-radius: 10px; color: #ffb4a8; padding: 10px 12px; font: 12px/1.5 var(--mono); white-space: pre-wrap; z-index: 2; }
.viewer .err.on { display: block; }
.viewer.file .err { display: none; }
.viewer .media { position: absolute; left: 16px; top: 16px; width: calc(100% - 32px); height: calc(100% - 32px); object-fit: contain; display: none; }
.viewer.file .fit, .viewer.file .loading { display: none; }
.viewer.file .media.on { display: block; }
.bar.file #formats, .bar.file #variants { opacity: .45; }

.transport { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: .5px solid var(--separator); }
.play { width: 32px; height: 32px; border-radius: 50%; background: var(--label); color: var(--window); display: grid; place-items: center; flex: none; }
.play svg { width: 13px; height: 13px; }
.time { font: 12px var(--mono); color: var(--label-2); min-width: 104px; font-variant-numeric: tabular-nums; }
.scrubwrap { position: relative; flex: 1; min-width: 0; display: flex; }
.scrubwrap input { flex: 1; min-width: 0; margin: 0; }
.marks { position: absolute; left: 8px; right: 8px; top: -9px; height: 0; pointer-events: none; }
.marks button { position: absolute; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--orange); pointer-events: auto; box-shadow: 0 0 0 2px var(--window); }
.marks button.done { background: var(--label-4); }
.keys { color: var(--label-3); font-size: 11.5px; white-space: nowrap; }

.notes-panel { height: 200px; overflow: auto; padding: 12px 18px 16px; }
.addnote { display: flex; gap: 8px; margin-bottom: 8px; }
.addnote textarea { flex: 1; min-width: 0; height: 30px; }
.addnote textarea:focus { height: 64px; }
.nt { display: grid; grid-template-columns: auto 1fr auto; gap: 2px 10px; padding: 8px 0; border-bottom: .5px solid var(--separator); }
.nt:last-child { border-bottom: 0; }
.nt .tc { font: 11.5px var(--mono); color: var(--orange); padding: 2px 7px; border-radius: 6px; background: var(--orange-soft); align-self: start; }
.nt.done .tc { color: var(--label-3); background: var(--fill-2); }
.nt.done .tx { color: var(--label-3); }
.nt .tx { white-space: pre-wrap; word-break: break-word; }
.nt .x { color: var(--label-3); font-size: 15px; line-height: 1; align-self: start; padding: 0 2px; }
.nt .x:hover { color: var(--label); }
.nt .meta { grid-column: 2 / 4; color: var(--label-3); font-size: 11.5px; }
.nt .meta .open { color: var(--orange); } .nt .meta .sent, .nt .meta .doing { color: var(--accent); } .nt .meta .done { color: var(--green); }
.nt .reply { grid-column: 2 / 4; font-size: 12.5px; color: var(--label-2); border-left: 2px solid var(--separator-strong); padding-left: 9px; margin-top: 3px; white-space: pre-wrap; }

/* the right column */
.qring { position: relative; width: 22px; height: 22px; display: grid; place-items: center; margin-left: auto; }
.qring svg { position: absolute; inset: 0; width: 22px; height: 22px; transform: rotate(-90deg); }
.qring circle { fill: none; stroke-width: 2.2; }
.qring .track { stroke: var(--fill); }
.qring .arc { stroke: var(--orange); stroke-linecap: round; stroke-dasharray: 18 70; opacity: 0; }
.qring.busy .arc { opacity: 1; animation: kit-spin 1.1s linear infinite; transform-origin: 11px 11px; }
.qring span { position: relative; font: 600 10.5px/1 var(--font); color: var(--label-2); font-variant-numeric: tabular-nums; }
.qrow { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 6px; border-radius: 8px; }
.qrow:hover { background: var(--hover); }
.qrow[draggable=true] { cursor: grab; } .qrow.drag { opacity: .4; } .qrow.over { box-shadow: inset 0 2px 0 var(--accent); }
.qrow .n { color: var(--label-3); font-size: 11.5px; text-align: center; font-variant-numeric: tabular-nums; }
.qrow .n.run { color: var(--orange); }
.qrow b { font-weight: 500; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow small { color: var(--label-3); font-size: 11.5px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow button { color: var(--label-3); width: 20px; height: 20px; border-radius: 50%; } .qrow button:hover { color: var(--label); background: var(--fill-2); }

.group { display: flex; align-items: center; gap: 7px; padding: 10px 8px 4px; font-size: 11.5px; font-weight: 600; color: var(--label-3); }
.group:first-child { padding-top: 0; }
.group i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--label-4); }
.s-rendering i { background: var(--orange); } .s-attention i { background: var(--red); } .s-ready i { background: var(--green); }
.s-queued i { background: var(--purple); } .s-cooking i { background: var(--accent); } .s-main i { background: var(--label-4); }
.comp { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start; width: 100%; text-align: left; padding: 7px 8px; border-radius: 9px; }
.comp:hover { background: var(--hover); }
.comp.on { background: var(--selected); }
.comp .th { width: 64px; height: 36px; border-radius: 5px; object-fit: cover; background: var(--fill-2); display: block; margin-top: 1px; box-shadow: inset 0 0 0 .5px var(--separator); }
.comp b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp span { color: var(--label-3); font-size: 11.5px; }
.comp .br { display: inline-block; font: 10.5px/1.6 var(--mono); color: var(--label-3); background: var(--fill-2); border-radius: 4px; padding: 0 5px; margin-top: 3px; }
.comp .note { display: block; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp.s-attention .note { color: var(--red); }
.comp .count { float: right; background: var(--orange); color: #fff; }
.prog { height: 3px; background: var(--fill); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.prog b { display: block; height: 100%; background: var(--orange); border-radius: 2px; }

.matrix { border-collapse: collapse; margin-bottom: 10px; }
.matrix th { font-weight: 500; color: var(--label-3); font-size: 11.5px; text-align: left; padding: 0 16px 6px 0; }
.matrix td { padding: 3px 16px 3px 0; }
.lookrow { display: flex; gap: 8px; margin-bottom: 6px; }
.lookrow .select { flex: 1; min-width: 0; }
.lookabout { color: var(--label-3); font-size: 11.5px; margin: 0 0 10px; min-height: 1em; }
#renderBtn { width: 100%; }
.job { font-size: 12px; padding: 8px 2px; border-bottom: .5px solid var(--separator); color: var(--label-3); }
.job b { color: var(--label); font-weight: 500; }
.job .st { float: right; }
.job .st.running { color: var(--orange); } .job .st.waiting { color: var(--accent); } .job .st.done { color: var(--green); } .job .st.failed { color: var(--red); }
.job .cx { color: var(--label-3); padding-left: 8px; } .job .cx:hover { color: var(--label); }
.renders { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.card { background: var(--surface); border-radius: 10px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow-sm); }
.card:hover { box-shadow: var(--shadow); }
.card.on { box-shadow: 0 0 0 2px var(--accent); }
.card video, .card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: contain; background: #000; }
.card div { padding: 7px 9px; font-size: 11px; display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.card span { color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.card a { white-space: nowrap; font-weight: 500; }
@media (max-height: 820px) { .notes-panel { height: 150px; } }
@media (max-width: 900px) { .viewer { height: 56vh; min-height: 260px; } .keys { display: none; } }
</style>
</head>
<body>
<div class="shell">
  <section class="pane-side pane-left" id="persona"></section>
  <main class="pane-main stage">
    <header class="bar" id="bar">
      <div class="titles">
        <h1 id="title">—</h1>
        <div class="sub"><span class="badge" id="statusChip"></span><span class="mono branch" id="branchChip"></span><span class="notes" id="notes"></span></div>
      </div>
      <div class="bar-controls">
        <div class="segmented" id="formats"></div>
        <div class="segmented" id="variants"></div>
        <button class="toggle on" id="loopBtn" title="Loop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>Loop</button>
        <button class="toggle" id="soundBtn" title="Sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.7a.7.7 0 0 0-1.2-.5L6.4 7.6A1.4 1.4 0 0 1 5.4 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.4a1.4 1.4 0 0 1 1 .4l3.4 3.4a.7.7 0 0 0 1.2-.5Z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.4 18.4a9 9 0 0 0 0-12.8"/></svg>Sound</button>
        <div class="src"><button class="icon-btn" id="prevFile" title="Previous file (↑)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><select class="select" id="fileSel" title="What the viewer shows"></select><button class="icon-btn" id="nextFile" title="Next file (↓)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></div>
      </div>
    </header>
    <div class="viewer" id="viewer"><div class="fit" id="fit"></div><div class="loading" id="loading">Loading…</div><div class="err" id="err"></div><video class="media" id="vid" playsinline preload="auto"></video><img class="media" id="pic" alt=""></div>
    <div class="transport">
      <button class="play" id="playBtn"></button>
      <span class="time" id="time">0.00 / 0.00</span>
      <div class="scrubwrap"><div class="marks" id="marks"></div><input type="range" id="scrub" min="0" max="1" step="0.001" value="0"></div>
      <span class="keys">Space play · ←→ frame · ⇧ second · ↑↓ file · N note</span>
    </div>
    <div class="notes-panel">
      <div class="addnote"><textarea class="field" id="noteText" placeholder="Note at 0:00.00 — goes to the Director  (N)"></textarea><button class="btn" id="noteBtn">Add</button></div>
      <div id="notes2"></div>
    </div>
  </main>
  <aside class="pane-side pane-right">
    <div class="section">
      <div class="section-title">Render queue <span class="qring" id="qbtn" title="Render queue"><svg viewBox="0 0 26 26"><circle class="track" cx="13" cy="13" r="10.5"/><circle class="arc" cx="13" cy="13" r="10.5"/></svg><span id="qcount">0</span></span></div>
      <div id="queue"></div>
      <button class="toggle next" id="nextBtn" title="Put this piece first in the render queue" style="margin-top:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg><span>Render next</span></button>
    </div>
    <div class="section"><div class="section-title">Pieces</div><div id="comps"></div></div>
    <div class="section">
      <div class="section-title">Render this piece</div>
      <table class="matrix" id="jobGrid"></table>
      <div class="lookrow"><select class="select" id="lookSel" title="Look: restyle the finished render"><option value="">Original look</option></select><button class="btn" id="lookPrev" title="Preview this look at the playhead">Preview</button></div>
      <div class="lookabout" id="lookAbout"></div>
      <button class="btn primary big" id="renderBtn">Render selected</button>
      <div id="jobs"></div>
    </div>
    <div class="section"><div class="section-title">Renders</div><div class="renders" id="renders"></div></div>
  </aside>
</div>
<audio id="audio" preload="auto"></audio>
<script>
// Cube Studio: live preview of a composition (the same page the renderer drives, stepped with
// window.renderFrame(t) at display rate), format/variant switches, render queue and renders.
// Any render can be opened in the viewer; ↑/↓ flip through the files at the same playhead.
// Pieces come from every checkout (main and the agents' worktrees), grouped by where they stand.
const $ = id => document.getElementById(id);
const DIMS = { '16x9': [1920, 1080], '9x16': [1080, 1920], '1x1': [1080, 1080], '4x5': [1080, 1350] };
const LABEL = { '16x9': '16:9', '9x16': '9:16', '1x1': '1:1', '4x5': '4:5' };
// format icons: Lucide's rectangle-horizontal, rectangle-vertical and square (ISC), and a 4:5 in the same style
const ICON_RECT = { '16x9': [2, 6, 20, 12], '9x16': [6, 2, 12, 20], '1x1': [3, 3, 18, 18], '4x5': [4.8, 3, 14.4, 18] };
const fmtIcon = f => { const [x, y, w, h] = ICON_RECT[f]; return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2"/></svg>`; };
const GROUPS = { rendering: 'Rendering now', attention: 'Needs attention', ready: 'Ready for review', cooking: 'In progress', queued: 'In the render queue', main: 'Done' };
const PLAY_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>';
const PAUSE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.2"/><rect x="14" y="4" width="5" height="16" rx="1.2"/></svg>';
const STATUS_COLOR = { rendering: 'orange', attention: 'red', ready: 'green', queued: 'purple', cooking: 'blue', main: '' };
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const audio = $('audio'), vid = $('vid'), pic = $('pic');
let comps = [], comp = null, fmt = '16x9', variant = '', frame = null;
let nextDraw = 0, t = 0, drawn = -1, playing = false, loop = true, sound = false, last = 0, ready = false;
let view = null;                 // the render on screen, or null for the live preview
const isVideo = f => f.file.endsWith('.mp4');
// the mtime makes a re-encoded render a new URL, so a player never asks for byte ranges of the old file
const fileSrc = f => `${f.url}?v=${Math.round(f.mtime)}`;

let compsSig = '';
async function load() {
  comps = await (await fetch('/api/compositions')).json();
  const sig = JSON.stringify(comps.map(c => [c.key, c.title, c.duration, c.formats, c.status, c.notes, c.thumb, c.openNotes]));
  if (sig !== compsSig) {
    compsSig = sig;
    $('comps').innerHTML = '';
    let group = null;
    comps.forEach(c => {
      if (c.status !== group) {
        group = c.status;
        const n = comps.filter(x => x.status === group).length;
        $('comps').insertAdjacentHTML('beforeend', `<div class="group s-${group}"><i></i>${GROUPS[group]}${n > 1 ? ` · ${n}` : ''}</div>`);
      }
      const b = document.createElement('button');
      b.className = `comp s-${c.status}`; b.dataset.key = c.key;
      const r = c.rendering || [], done = r.reduce((a, x) => a + x.done, 0), all = r.reduce((a, x) => a + x.total, 0);
      b.innerHTML = (c.thumb ? `<img class="th" src="${c.thumb}" alt="" loading="lazy">` : '<div class="th"></div>') + '<div>' +
        (c.openNotes ? `<span class="count" title="Open notes">${c.openNotes}</span>` : '') + `<b>${esc(c.title)}</b>` +
        (c.status === 'main' ? `<span>${c.duration}s · ${c.formats.map(f => LABEL[f]).join(' · ')}</span>` : '') +
        (c.notes.length ? `<span class="note">${esc(c.notes.join(' · '))}</span>` : '') +
        (all ? `<div class="prog"><b style="width:${(100 * done / all).toFixed(1)}%"></b></div>` : '') + '</div>';
      b.onclick = () => select(c.key);
      $('comps').appendChild(b);
    });
  }
  const keep = comp && comps.find(c => c.key === comp.key);
  if (keep) {
    comp = keep; highlight(); renderFiles(); info();
    // a render on screen that was re-encoded reloads at the same playhead; one that is gone falls back to live
    const f = view && comp.renders.find(x => x.file === view.file);
    if (view && view.preview) return;      // a look preview stays until you move on
    if (view && !f) show(null); else if (f && f.mtime !== view.mtime) show(f); else if (f) view = f;
    return;
  }
  // #<checkout>/<piece>[/<render>]; an old #<piece> link opens the piece wherever it is
  const parts = decodeURIComponent(location.hash.slice(1)).split('/');
  const hit = comps.find(c => c.key === parts.slice(0, 2).join('/')), old = !hit && comps.find(c => c.id === parts[0]);
  const file = hit ? parts[2] : old ? parts[1] : null;
  select((hit || old || comps[0]).key);
  const f = file && comp.renders.find(x => x.file === file);
  if (f) show(f);
}
function highlight() { $('comps').querySelectorAll('.comp').forEach(b => b.classList.toggle('on', b.dataset.key === comp.key)); }
const hash = () => history.replaceState(null, '', '#' + comp.key + (view ? '/' + view.file : ''));
// status, branch and notes for the piece on screen
function info() {
  $('statusChip').className = `badge ${STATUS_COLOR[comp.status] || ''}`;
  $('statusChip').innerHTML = `<i></i>${GROUPS[comp.status]}`;
  $('branchChip').textContent = comp.branch || comp.checkout;
  $('branchChip').title = [comp.session && `Session: ${comp.session}`, comp.lastCommit].filter(Boolean).join('\n');
  $('notes').className = `notes s-${comp.status}`;
  $('notes').textContent = comp.status === 'main' ? comp.description || '' : comp.notes.join(' · ');
}
function select(key) {
  comp = comps.find(c => c.key === key);
  fmt = comp.formats.includes(fmt) ? fmt : comp.formats[0];
  variant = comp.variants.includes(variant) ? variant : comp.variants[0];
  t = 0;
  $('title').textContent = comp.title;
  audio.pause();
  if (comp.audioUrl) { audio.src = comp.audioUrl; audio.volume = Math.min(1, 10 ** (comp.audioGain / 20)); } else audio.removeAttribute('src');
  view = null; unload();
  notes = []; notesSig = ''; renderNotes(); loadNotes();
  info(); highlight(); renderGrid(); renderFiles();
  // a finished piece (ready or on main) opens on its render, which the browser decodes off the main thread;
  // the live preview, which runs the whole piece on the page's thread, opens only when you ask for it
  const r = (comp.status === 'ready' || comp.status === 'main') && renderFor(fmt);
  if (r) show(r); else { closeLive(); open(); }
  hash();
}
function seg(el, items, cur, label, pick) {
  el.innerHTML = ''; el.style.display = items.length > 1 ? '' : 'none';
  items.forEach(v => { const b = document.createElement('button'); b.innerHTML = (ICON_RECT[v] ? fmtIcon(v) : '') + esc(label(v)); b.className = v === cur ? 'on' : ''; b.onclick = () => pick(v); el.appendChild(b); });
}
function controls() {
  // format and variant drive the live preview, so picking one while a render is on screen goes back to live
  const repick = () => { const r = view && renderFor(fmt); if (r) show(r); else if (view) show(null); else open(); controls(); };
  seg($('formats'), comp.formats, fmt, f => LABEL[f], f => { fmt = f; repick(); });
  seg($('variants'), comp.variants, variant, v => v || 'default', v => { variant = v; repick(); });
  $('loopBtn').classList.toggle('on', loop);
  $('soundBtn').classList.toggle('on', sound); $('soundBtn').disabled = !view && !comp.audioUrl;
  $('scrub').step = 1 / comp.fps;
}
// the newest MP4 render of this format (and variant), if there is one
function renderFor(f) {
  const vids = comp.renders.filter(x => isVideo(x));
  const name = x => x.file.replace(/\.mp4$/, '');
  const exact = vids.filter(x => name(x).endsWith('-' + f + (variant ? '-' + variant : '')) || name(x).endsWith('-' + f));
  return exact.sort((a, b) => b.mtime - a.mtime)[0] || null;
}

    suggestions: () => ['Pitch three ideas for a 15 s piece', comp ? `Make “${comp.title}” feel more energetic` : 'Make a 10 s loop of our logo', 'Render every format of this piece'],
  },
  context: () => comp && {
    label: `${comp.title} · ${view ? view.file : `${LABEL[fmt] || fmt}${variant ? ' ' + variant : ''} · ${fmtT(t)}`}`,
    ref: { key: comp.key, t: Math.round(t * 100) / 100, fmt },
    key: comp.key, fmt, variant, t: Math.round(t * 100) / 100, file: view ? view.file : null,
  },
  refFor,
  open: ref => {
    if (!ref?.key || !comps.some(c => c.key === ref.key)) return;
    if (!comp || comp.key !== ref.key) select(ref.key);
    if (ref.t != null) seek({ t: Number(ref.t), fmt: ref.fmt || null });
  },
  onResize: () => fit(),
});
new ResizeObserver(() => fit()).observe(document.getElementById('viewer'));
setInterval(() => window.director.refreshContext(), 250);   // the playhead moves; the chip follows
</script>
</body>
</html>
